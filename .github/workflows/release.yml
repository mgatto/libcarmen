name: Release

# Tagged releases only -- ordinary pushes/PRs stay on ci.yml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-demo-sdk:
    name: Windows demo zip + SDK zip
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v5

      # Artifact names use the VERSION file (the single source of truth).
      # The Release is named from the git tag. Fail early if they disagree
      # (tag vX.Y.Z must match the VERSION file's X.Y.Z).
      - name: Check tag matches VERSION file
        uses: ./.github/actions/check-version

      # Same FriBidi path as ci.yml: vcpkg, not the vendored Autotools tree.
      - name: Install FriBidi via vcpkg
        run: vcpkg install fribidi:x64-windows

      - name: Configure and package (Release shared)
        run: |
          cmake -S . -B build-cmake-package -A x64 -DBUILD_SHARED_LIBS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build-cmake-package --config Release --target demo_package sdk_package -j

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem `
            build-cmake-package/libcarmen-demo-*-windows-*.zip, `
            build-cmake-package/libcarmen-sdk-*-windows-*-shared.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          if ($lines.Count -eq 0) { throw "no archives found" }
          $lines | Set-Content -Path "build-cmake-package/sha256sums-${{ runner.os }}.txt"
          Write-Host ($lines -join "`n")

      # Partial checksum, combined with the Unix legs' into one sha256sums.txt
      # by the `publish` job after every leg has uploaded.
      - name: Upload checksum partial
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ runner.os }}
          path: build-cmake-package/sha256sums-${{ runner.os }}.txt
          if-no-files-found: error

      # Upload to a draft release. GitHub locks assets after publication, so a
      # later job (or the Unix matrix leg) cannot add/overwrite assets on an
      # already-published release; keeping it a draft until every job has
      # uploaded is what the trailing `publish` job unpublishes at the end.
      - name: Upload to draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            build-cmake-package/libcarmen-demo-*-windows-*.zip
            build-cmake-package/libcarmen-sdk-*-windows-*-shared.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  # macOS and Linux demo tarballs plus both flavored SDK tarballs. Built
  # natively on each runner (no cross-compilation): the demo links the shared
  # lib via rpath, so the archive ships it (and its soname symlink on Unix)
  # next to trail_demo. `make package` / `make sdk` are the local macOS
  # equivalents; these matrices are what feed the tagged GitHub Release.
  unix-demo-sdk:
    name: ${{ matrix.os }} demo + SDK tarballs
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Artifact names use the VERSION file (the single source of truth).
      # The Release is named from the git tag. Fail early if they disagree
      # (tag vX.Y.Z must match the VERSION file's X.Y.Z).
      - name: Check tag matches VERSION file
        uses: ./.github/actions/check-version

      # Release shared build so the demo archive ships carmen's shared library
      # (and its soname symlink) next to trail_demo, and the shared SDK tarball
      # is produced by the same build. FriBidi is compiled from the vendored
      # tree on Unix, so there is no vcpkg step here. demo_package emits a
      # signed .dmg on macOS and a .tar.gz on Linux.
      - name: Configure and package (Release shared)
        run: |
          cmake -S . -B build-cmake-package -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build-cmake-package --target demo_package sdk_package -j

      # The static SDK tarball comes from its own static Release build.
      - name: Build static SDK
        run: |
          cmake -S . -B build-cmake-sdk-static -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build-cmake-sdk-static --target sdk_package -j

      # The demo archive is a .dmg on macOS and a .tar.gz on Linux, so its path
      # is discovered (rather than globbed) and exported for the checksum and
      # upload steps below. A missing demo archive fails loudly.
      - name: Locate demo archive
        shell: bash
        run: |
          demo="$(find build-cmake-package -maxdepth 1 \( -name 'libcarmen-demo-*.tar.gz' -o -name 'libcarmen-demo-*.dmg' \) -print -quit)"
          [ -n "$demo" ] || { echo "demo archive not found"; exit 1; }
          echo "DEMO_ARCHIVE=$demo" >> "$GITHUB_ENV"

      - name: SHA256 checksum
        run: |
          : > "build-cmake-package/sha256sums-${{ runner.os }}.txt"
          shared_sdk="$(find build-cmake-package -maxdepth 1 -name 'libcarmen-sdk-*-shared.tar.gz' -print -quit)"
          static_sdk="$(find build-cmake-sdk-static -maxdepth 1 -name 'libcarmen-sdk-*-static.tar.gz' -print -quit)"
          for archive in "$DEMO_ARCHIVE" "$shared_sdk" "$static_sdk"; do
            [ -n "$archive" ] && [ -f "$archive" ] || { echo "archive not found: $archive"; exit 1; }
            printf '%s  %s\n' \
              "$(shasum -a 256 "$archive" | cut -d' ' -f1)" "$(basename "$archive")" \
              >> "build-cmake-package/sha256sums-${{ runner.os }}.txt"
          done
          cat "build-cmake-package/sha256sums-${{ runner.os }}.txt"

      # Partial checksum, combined with the other legs' into one sha256sums.txt
      # by the `publish` job after every leg has uploaded.
      - name: Upload checksum partial
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ runner.os }}
          path: build-cmake-package/sha256sums-${{ runner.os }}.txt
          if-no-files-found: error

      # Upload to the same draft release (see the Windows job's comment).
      - name: Upload to draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            ${{ env.DEMO_ARCHIVE }}
            build-cmake-package/libcarmen-sdk-*-shared.tar.gz
            build-cmake-sdk-static/libcarmen-sdk-*-static.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Publish only after every build job has finished uploading, so the release
  # stays a draft (mutable) until all assets are in place. Publishing is the
  # point of no return: GitHub marks a published release immutable, so no
  # asset can be added, overwritten, or deleted afterwards. This job also
  # assembles the per-leg checksum partials into a single sha256sums.txt
  # covering every archive, then uploads it before publishing.
  publish:
    name: Assemble checksums and publish
    runs-on: ubuntu-latest
    needs: [windows-demo-sdk, unix-demo-sdk]
    steps:
      - name: Download checksum partials
        uses: actions/download-artifact@v7
        with:
          pattern: checksums-*
          merge-multiple: true
          path: checksums

      - name: Assemble sha256sums.txt
        run: |
          cat checksums/sha256sums-*.txt | sort -k2 > sha256sums.txt
          cat sha256sums.txt

      - name: Upload unified sha256sums.txt
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: sha256sums.txt
          fail_on_unmatched_files: true

      # This job never checks out the repository, so `gh` has no .git/ to infer
      # the repo from. Point it at the repo explicitly via GH_REPO.
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
